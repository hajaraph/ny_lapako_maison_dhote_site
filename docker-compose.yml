services:
  backend:
    build:
      context: .
      target: backend
    volumes:
      - uploads:/app/uploads
    environment:
      - JWT_SECRET=votre_secret_tres_sur_a_changer_en_production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      target: frontend-nginx
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maison.rule=Host(`maison.local`)"
      - "traefik.http.routers.maison.entrypoints=web"
      - "traefik.http.services.maison.loadbalancer.server.port=80"

volumes:
  uploads:
