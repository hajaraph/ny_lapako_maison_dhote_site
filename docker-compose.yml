services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    expose:
      - "3000"
    volumes:
      - ./backend/maison.sqlite:/app/backend/maison.sqlite
      - ./backend/uploads:/app/backend/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-nginx
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    restart: unless-stopped
