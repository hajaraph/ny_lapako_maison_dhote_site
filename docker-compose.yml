services:
  backend:
    build:
      context: .
      target: backend
    volumes:
      - backend-data:/app
      - uploads:/app/uploads
    environment:
      - JWT_SECRET=votre_secret_tres_sur_a_changer_en_production
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-nginx
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maison.rule=Host(`maison.local`)"
      - "traefik.http.routers.maison.entrypoints=web"
      - "traefik.http.services.maison.loadbalancer.server.port=80"

volumes:
  backend-data:
  uploads:
