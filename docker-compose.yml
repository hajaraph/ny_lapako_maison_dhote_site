networks:
  webapp_preprod:

services:
  backend:
    build:
      context: .
      target: backend
    volumes:
      - uploads:/app/uploads
    environment:
      - JWT_SECRET=votre_secret_tres_sur_a_changer_en_production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - webapp_preprod

  frontend:
    build:
      context: .
      target: frontend-nginx
      args:
        VITE_API_BASE_URL: http://backend:3000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - webapp_preprod

volumes:
  uploads:
